# systemd drop-in for hhd.service: /etc/systemd/system/hhd.service.d/10-tdp-fan-only.conf
# Load only hhd's "adjustor" plugin (TDP, fan curve, GPU/battery limits).
# Every other provider is skipped, including "gpd_win" (controller emulation),
# "generic", "overlay" and "powerbuttond", so hhd never touches the gamepad,
# back buttons or IMU that InputPlumber owns.
# Note: hhd's plugins.yml blacklist only logs and does not actually skip a
# provider (hhd 4.1.x), so the HHD_PLUGINS whitelist is the reliable switch.
[Service]
Environment=HHD_PLUGINS=adjustor
